<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special for Lifta 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff758c;
            --secondary: #ff7eb3;
            --accent: #ffafbd;
            --white: rgba(255, 255, 255, 0.9);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Quicksand', sans-serif;
            background: #ffdee9;
            background-image: linear-gradient(0deg, #ffdee9 0%, #b5fffc 100%);
        }

        #canvas {
            position: absolute; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .main-wrapper {
            position: relative; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100%;
        }

        .glass-card {
            background: var(--white);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 40px 25px;
            width: 85%; max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            transition: all 0.6s ease;
        }

        .emoji-box {
            font-size: 80px; margin-bottom: 20px;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d63384; font-size: 2.3rem; margin: 0 0 20px 0;
        }

        .btn-container {
            display: flex; flex-direction: column; gap: 15px;
            margin-top: 20px; min-height: 180px; position: relative;
        }

        .btn {
            padding: 16px; border: none; border-radius: 50px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
            z-index: 100;
        }

        .btn-no {
            background: white; color: #888; border: 1px solid #eee;
        }

        #success-content { display: none; }

        #typing-text {
            font-size: 0.95rem; line-height: 1.7; color: #444;
            text-align: justify; max-height: 250px; overflow-y: auto;
            padding: 10px; border-top: 1px solid #ffeef2;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    
    <audio id="myAudio" loop>
        <source src=" 

" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <div class="glass-card" id="card">
            <div id="ask-content">
                <div class="emoji-box" id="mainEmoji">🐈</div>
                <h1>Will you be my Valentine, Lifta?</h1>
                <div class="btn-container">
                    <button class="btn btn-yes" id="yesBtn" onclick="accepted()">Yes, I will! 💖</button>
                    <button class="btn btn-no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No</button>
                </div>
            </div>

            <div id="success-content">
                <div class="emoji-box">👸🏻</div>
                <h1 style="font-size: 1.8rem;">You're My Favorite Person!</h1>
                <div id="typing-text"></div>
                <div style="margin-top: 15px; font-size: 24px;">🎵✨🌹</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 5 + 2;
                this.speed = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) this.y = -10;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 117, 140, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i=0; i<50; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        let yesScale = 1;
        function moveNo() {
            const btnNo = document.getElementById('noBtn');
            const btnYes = document.getElementById('yesBtn');
            btnNo.style.position = 'fixed';
            btnNo.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            btnNo.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            yesScale += 0.2;
            btnYes.style.transform = `scale(${yesScale})`;
            document.getElementById('mainEmoji').innerText = '😿';
        }

        const msg = "Hello Lifta sayang... \n\nHAPPY VALENTINE'S DAY 💌\n\nI just want you to know how much you truly mean to me. You're the warmth in my quietest moments and the best part of my every day. \n\nThank you for coming into my life, for making me smile, and for being my biggest supporter. I really appreciate you so much. I hope my prayers can hug you when my arms can't.\n\nI love you so much! 💕";

        function accepted() {
            const audio = document.getElementById('myAudio');
            audio.play().catch(e => console.log("Audio play failed: ", e));
            
            document.getElementById('ask-content').style.display = 'none';
            document.getElementById('success-content').style.display = 'block';
            
            let i = 0;
            const target = document.getElementById('typing-text');
            function type() {
                if (i < msg.length) {
                    target.innerHTML += msg.charAt(i) === '\n' ? '<br>' : msg.charAt(i);
                    i++;
                    target.scrollTop = target.scrollHeight;
                    setTimeout(type, 40);
                }
            }
            type();
        }
    </script>
</body>
</html>
