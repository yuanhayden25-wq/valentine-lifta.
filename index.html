<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special for Lifta 💖</title>
    <style>
        :root { --pink: #fbc2eb; --dark-pink: #d88190; --krem: #fff5e1; }
        body { background: var(--krem); color: var(--dark-pink); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* Animasi Elemen Melayang (Bunga & Kucing) */
        .floating { position: fixed; z-index: 1; pointer-events: none; animation: float 6s ease-in-out infinite; opacity: 0.7; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-25px) rotate(15deg); } }

        .card { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 15px 35px rgba(216, 129, 144, 0.2); width: 85%; max-width: 400px; z-index: 10; text-align: center; border: 2px solid var(--pink); position: relative; }
        .main-img { width: 100%; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        #typing-text { font-size: 1rem; line-height: 1.6; min-height: 50px; text-align: center; }
        
        .buttons { display: flex; justify-content: center; gap: 15px; margin-top: 25px; position: relative; height: 60px; }
        .btn { border: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-yes { background: var(--pink); color: white; box-shadow: 0 5px 15px var(--pink); z-index: 11; }
        .btn-no { background: #eee; color: #888; position: absolute; z-index: 12; transition: 0.1s; }

        #success-content { display: none; }
        .emoji-header { font-size: 50px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="floating" style="top: 10%; left: 10%; font-size: 40px;">🌸</div>
    <div class="floating" style="top: 25%; right: 15%; font-size: 35px; animation-delay: 1s;">🐈</div>
    <div class="floating" style="bottom: 15%; left: 15%; font-size: 30px; animation-delay: 2s;">🌻</div>
    <div class="floating" style="bottom: 20%; right: 10%; font-size: 35px; animation-delay: 1.5s;">🌼</div>

    <div class="card">
        <div id="ask-content">
            <div class="emoji-header">🐈✨</div>
            <h1>Will you be my Valentine, Lifta? 🎀</h1>
            <p>Klik "Yes" kalau kamu sayang!</p>
            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn" onclick="accepted()">Yes!</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No</button>
            </div>
        </div>

        <div id="success-content">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmYxeXNyeXJpZ3R3bm9idG5qZzR4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KZTv76q7G5Y2eK6r9P/giphy.gif" class="main-img">
            <h1>Yeeay! Happy Valentine! 💖</h1>
            <div id="typing-text"></div>
            <div style="font-size: 30px; margin-top: 15px;">🌸🌼🌻</div>
        </div>
    </div>

    <script>
        let yesSize = 16;
        // SILAKAN GANTI TEKS DI BAWAH INI SESUAI KEINGINANMU
        const messages = [
            "Hello Lifta sayang... Thank you for clicking the Yes button! ",
           i just want you to know how much you truly mean to me, you're not just someone i care about, you're someone i carry with me in every thought, every quiet moment, every hope for the future. your presence in my life brings warmth, comfort and a sense of calm that's hard to put into words. even on your toughest day, please remember that you're never alone. i see your heart, i believe in your strength, and i'll always be here, cheering for you, supporting you, and loving you in every way i can . you matter more than you know. 🌸🌼🌻",
            "I love you so much, Lifta! ✨"
        ];

        function moveNo() {
            const btn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            
            const x = Math.random() * (window.innerWidth - btn.clientWidth);
            const y = Math.random() * (window.innerHeight - btn.clientHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';

            yesSize += 5;
            yesBtn.style.fontSize = yesSize + 'px';
            yesBtn.style.padding = (yesSize/1.5) + 'px ' + (yesSize*1.5) + 'px';
        }

        function accepted() {
            document.getElementById('ask-content').style.display = 'none';
            document.getElementById('success-content').style.display = 'block';
            startTyping();
            launchFlowers();
        }

        function startTyping() {
            let i = 0;
            let msgIndex = 0;
            const target = document.getElementById('typing-text');
            
            function type() {
                if (msgIndex < messages.length) {
                    if (i < messages[msgIndex].length) {
                        target.innerHTML += messages[msgIndex].charAt(i);
                        i++;
                        setTimeout(type, 50);
                    } else {
                        target.innerHTML += "<br>";
                        i = 0;
                        msgIndex++;
                        setTimeout(type, 800);
                    }
                }
            }
            type();
        }

        function launchFlowers() {
            const flowerEmojis = ['🌸', '🌼', '🌻', '💗'];
            setInterval(() => {
                const h = document.createElement('div');
                h.style.position = 'fixed';
                h.style.top = '-20px';
                h.style.left = Math.random() * 100 + 'vw';
                h.innerHTML = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                h.style.fontSize = '25px';
                h.style.zIndex = '100';
                h.style.transition = '4s linear';
                document.body.appendChild(h);
                setTimeout(() => {
                    h.style.transform = 'translateY(110vh) rotate(360deg)';
                }, 10);
                setTimeout(() => h.remove(), 4000);
            }, 250);
        }
    </script>
</body>
</html>
