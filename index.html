<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special for Lifta 💖</title>
    <style>
        :root { --pink: #fbc2eb; --dark-pink: #d88190; --krem: #fff5e1; }
        body { background: var(--krem); color: var(--dark-pink); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        
        .floating { position: fixed; z-index: 1; pointer-events: none; animation: float 6s ease-in-out infinite; opacity: 0.7; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .card { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 30px rgba(216, 129, 144, 0.2); width: 85%; max-width: 350px; z-index: 10; text-align: center; border: 2px solid var(--pink); }
        
        /* Area Tombol yang Terpisah Jauh */
        .btn-wrapper { margin-top: 30px; display: flex; flex-direction: column; gap: 40px; align-items: center; width: 100%; }
        
        .btn { border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem; width: 80%; -webkit-tap-highlight-color: transparent; }
        .btn-yes { background: var(--pink); color: white; box-shadow: 0 5px 15px var(--pink); position: relative; z-index: 20; }
        .btn-no { background: #eee; color: #888; position: relative; z-index: 10; }

        #success-content { display: none; }
        .main-img { width: 100%; border-radius: 20px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="floating" style="top: 10%; left: 10%; font-size: 40px;">🌸</div>
    <div class="floating" style="top: 20%; right: 10%; font-size: 35px; animation-delay: 1s;">🐈</div>
    <div class="floating" style="bottom: 15%; left: 10%; font-size: 30px; animation-delay: 2s;">🌻</div>

    <div class="card">
        <div id="ask-content">
            <div style="font-size: 50px; margin-bottom: 10px;">🐈✨</div>
            <h1>Will you be my Valentine, Lifta? 🎀</h1>
            <div class="btn-wrapper">
                <button class="btn btn-yes" id="yesBtn" onclick="accepted()">Yes!</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No</button>
            </div>
        </div>

        <div id="success-content">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNmYxeXNyeXJpZ3R3bm9idG5qZzR4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/KZTv76q7G5Y2eK6r9P/giphy.gif" class="main-img">
            <h1 id="yay-text">Yeeay! I Love You! 💖</h1>
            <div id="typing-text" style="font-size: 1rem; line-height: 1.5;"></div>
            <div style="font-size: 30px; margin-top: 15px;">🌸🌼🌻</div>
        </div>
    </div>

    <script>
        let yesScale = 1;
        const messages = [
            "Hello Lifta sayang... ",
            "HAPPY VALENTINE DAY💌 !",
            "i just want you to know how much you truly mean to me, you're not just someone i care about, you're someone i carry with me in every thought, every quiet moment, every hope for the future. your presence in my life brings warmth, comfort and a sense of calm that's hard to put into words. even on your toughest day, please remember that you're never alone. i see your heart, i believe in your strength, and i'll always be here, cheering for you, supporting you, and loving you in every way i can . you matter more than you know. 🌸🌼🌻",
            "I love you so much! ✨"
        ];

        function moveNo() {
            const btnNo = document.getElementById('noBtn');
            const btnYes = document.getElementById('yesBtn');
            
            // Jarak aman agar tidak kena tombol YES saat awal pindah
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';

            // Tombol YES membesar biar gampang diklik
            yesScale += 0.15;
            btnYes.style.transform = `scale(${yesScale})`;
        }

        function accepted() {
            document.getElementById('ask-content').style.display = 'none';
            document.getElementById('success-content').style.display = 'block';
            
            let i = 0;
            let msgIndex = 0;
            const target = document.getElementById('typing-text');
            
            function type() {
                if (msgIndex < messages.length) {
                    if (i < messages[msgIndex].length) {
                        target.innerHTML += messages[msgIndex].charAt(i);
                        i++;
                        setTimeout(type, 50);
                    } else {
                        target.innerHTML += "<br>";
                        i = 0;
                        msgIndex++;
                        setTimeout(type, 800);
                    }
                }
            }
            type();
            
            // Hujan Bunga
            setInterval(() => {
                const f = document.createElement('div');
                f.style.position = 'fixed';
                f.style.top = '-20px';
                f.style.left = Math.random() * 100 + 'vw';
                f.innerHTML = ['🌸', '🌼', '🌻'][Math.floor(Math.random()*3)];
                f.style.fontSize = '20px';
                f.style.transition = '4s linear';
                document.body.appendChild(f);
                setTimeout(() => { f.style.transform = 'translateY(110vh)'; }, 10);
                setTimeout(() => f.remove(), 4000);
            }, 300);
        }
    </script>
</body>
</html>
