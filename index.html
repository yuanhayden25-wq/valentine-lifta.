<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Special for Lifta 💖</title>
    <style>
        :root { --pink: #fbc2eb; --dark-pink: #d88190; --krem: #fff5e1; }
        body { background: var(--krem); color: var(--dark-pink); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: manipulation; }
        
        .floating { position: fixed; z-index: 1; pointer-events: none; animation: float 6s ease-in-out infinite; opacity: 0.7; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(216, 129, 144, 0.2); width: 80%; max-width: 350px; z-index: 10; text-align: center; border: 2px solid var(--pink); }
        .main-img { width: 100%; border-radius: 20px; margin-bottom: 15px; }
        
        h1 { font-size: 1.3rem; margin: 10px 0; }
        #typing-text { font-size: 0.95rem; line-height: 1.5; min-height: 50px; }
        
        /* Box Tombol diperbaiki supaya tidak tabrakan */
        .button-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; margin-top: 20px; min-height: 120px; position: relative; }
        
        .btn { border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; width: 100%; max-width: 200px; -webkit-tap-highlight-color: transparent; }
        .btn-yes { background: var(--pink); color: white; box-shadow: 0 5px 15px var(--pink); z-index: 15; position: relative; }
        .btn-no { background: #eee; color: #888; z-index: 10; transition: 0.1s; position: relative; }

        #success-content { display: none; }
    </style>
</head>
<body>

    <div class="floating" style="top: 10%; left: 10%; font-size: 40px;">🌸</div>
    <div class="floating" style="top: 20%; right: 10%; font-size: 35px; animation-delay: 1s;">🐈</div>
    <div class="floating" style="bottom: 15%; left: 10%; font-size: 30px; animation-delay: 2s;">🌻</div>
    <div class="floating" style="bottom: 10%; right: 15%; font-size: 35px; animation-delay: 1.5s;">🌼</div>

                <button class="btn btn-yes" id="yesBtn" onclick="accepted()">Yes!</button>
