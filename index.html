<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Lifta Tersayang</title>
    <style>
        :root {
            --primary: #ff758c;
            --secondary: #ff7eb3;
            --bg: #ffeef2;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #fbefef 0%, #ffeef2 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Latar Belakang Animasi Hati */
        .heart-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .heart-particle {
            position: absolute;
            color: var(--primary);
            opacity: 0.3;
            animation: move linear infinite;
        }

        @keyframes move {
            from { transform: translateY(100vh) rotate(0deg); }
            to { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Desain Kartu Glassmorphism */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.2);
            text-align: center;
            width: 85%;
            max-width: 400px;
        }

        .main-emoji {
            font-size: 80px;
            margin-bottom: 10px;
            display: inline-block;
            transition: transform 0.3s;
        }

        h1 {
            color: #d63384;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
            min-height: 150px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }

        .btn-no {
            background: #fff;
            color: #999;
            border: 1px solid #eee;
        }

        #success-screen {
            display: none;
        }

        #typing-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            text-align: left;
            margin-top: 20px;
        }

        .heart-icon {
            color: #ff4d4d;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div class="container" id="mainContainer">
        <div id="ask-screen">
            <div class="main-emoji" id="catEmoji">🐈</div>
            <h1>Will you be my Valentine, <span style="color: var(--primary);">Lifta?</span> 🎀</h1>
            <div class="btn-group">
                <button class="btn btn-yes" id="yesBtn" onclick="onAccepted()">Yes, I will! ✨</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No</button>
            </div>
        </div>

        <div id="success-screen">
            <div class="main-emoji">👸🏻</div>
            <h1 style="margin-bottom: 5px;">You made my day! 💖</h1>
            <div id="typing-text"></div>
        </div>
    </div>

    <script>
        // Membuat animasi hati melayang di background
        function createHearts() {
            const bg = document.getElementById('heartBg');
            for(let i=0; i<20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                bg.appendChild(heart);
            }
        }
        createHearts();

        let scale = 1;
        function moveNo() {
            const btnNo = document.getElementById('noBtn');
            const btnYes = document.getElementById('yesBtn');
            const emoji = document.getElementById('catEmoji');
            
            // Gerakan tombol No secara acak
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 100);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';

            // Tombol Yes semakin besar
            scale += 0.25;
            btnYes.style.transform = `scale(${scale})`;
            
            // Ganti emoji saat menolak
            emoji.innerText = '😿';
            setTimeout(() => { emoji.innerText = '🐈'; }, 500);
        }

        const message = "Hello Lifta sayang... \n\nHAPPY VALENTINE'S DAY 💌\n\nI just want you to know how much you truly mean to me. You're the warmth in my quietest moments and the best part of my every day. Please remember that you never have to walk alone—I'll always be right here, cheering for you and loving you in every way I can. You matter more than words can say.";

        function onAccepted() {
            document.getElementById('ask-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
            
            let i = 0;
            const target = document.getElementById('typing-text');
            
            function typeWriter() {
                if (i < message.length) {
                    if (message.charAt(i) === '\n') {
                        target.innerHTML += '<br>';
                    } else {
                        target.innerHTML += message.charAt(i);
                    }
                    i++;
                    setTimeout(typeWriter, 40);
                }
            }
            typeWriter();
        }
    </script>
</body>
</html>
